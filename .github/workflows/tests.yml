# The add-on tests run on every push and pull request that changes code. The Windows agent and
# installer jobs (GitHub's Windows Server machines, with the real Windows PowerShell 5.1 the agent
# runs on) are slower, so a push runs them only when it changes the agent, the installer or their
# tests. Pull requests, manual runs (Actions tab, "Run workflow") and the weekly run do everything.
name: Tests

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: everything, e.g. in case GitHub's Windows image changed

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.f.outputs.agent }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Anything but a normal push, or if the diff can't be worked out: run everything.
          if [ "$EVENT" != "push" ] || ! changed=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null); then
            echo "agent=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(rollcall/app/agent/|rollcall/app/msi\.py$|tests/(test_agent_|test_openwrt_agent|test_secret_scan|secret_corpus|build_test_msi|msi_check)|\.github/)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          elif python3 .github/agent_source_changed.py "$BEFORE" "$AFTER"; then
            echo "agent=true" >> "$GITHUB_OUTPUT"   # main.py's code that builds the agent script changed
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Add-on and agents (Linux, PowerShell 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q busybox && pip install pytest pyyaml aiohttp cryptography regex aiosmtpd
      - run: python -m pytest -q tests
        env:
          PWSH: pwsh

  openwrt:
    name: OpenWrt agent (real OpenWrt image)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Fetch an OpenWrt image
        run: |
          # OpenWrt's own images; the first of these that exists
          for t in x86-64-23.05.5 x86_64-23.05.5 x86-64-v23.05.5 x86_64-v23.05.5 x86-64-openwrt-23.05 x86_64-openwrt-23.05 x86-64 x86_64; do
            if docker pull -q "openwrt/rootfs:$t"; then echo "OPENWRT_IMAGE=openwrt/rootfs:$t" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "No OpenWrt image found"; exit 1
      - name: What the image has
        run: |
          docker run --rm --entrypoint /bin/sh "$OPENWRT_IMAGE" -c 'cat /etc/openwrt_release; for c in jsonfilter uclient-fetch wget curl ubus logread; do echo "$c = $(command -v $c || echo missing)"; done'
      - run: python -m pytest -v tests/test_openwrt_agent.py

  windows:
    name: Windows agent (Windows PowerShell 5.1)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests/test_agent_strict.py tests/test_secret_scan.py tests/test_agent_route.py tests/test_agent_startup_network.py tests/test_agent_run_lock.py

  msi-build:
    name: Build a test agent installer
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q msitools wixl && pip install pyyaml aiohttp cryptography regex
      - run: python tests/build_test_msi.py out/agent.msi
      - uses: actions/upload-artifact@v4
        with:
          name: test-msi
          path: out/agent.msi

  msi-windows:
    name: Agent installer on Windows (silent and interactive)
    needs: msi-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: test-msi
          path: out
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/msi_check.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-results
          path: |
            out/*.png
            out/*.log
