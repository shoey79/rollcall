configuration:
  interval:
    name: Check interval (seconds)
    description: How often each device and service is checked, from 30 to 3600 seconds.
  retry_interval:
    name: Re-check after a miss (seconds)
    description: How soon something that didn't answer is checked again before it goes red. Lower it (e.g. 60) to find out sooner.
  ping_count:
    name: Ping packets per check
    description: How many pings to send each check. Any reply counts as up.
  ping_timeout:
    name: Ping timeout (seconds)
    description: How long to wait for each ping reply.
  service_timeout:
    name: Service check timeout (seconds)
    description: How long to wait for a port, web page, SIP or certificate check to answer.
  history_days:
    name: Keep history for (days)
    description: How long check results and syslog messages are kept, from 1 to 90 days.
  metrics_days:
    name: Keep graphs for (days)
    description: How long disk, network, CPU and memory history from agents is kept for graphs, from 7 to 1825 days (5 years). After two days it's kept as hourly figures, and after a month as daily ones.
  notify_services:
    name: Phone or other notifications
    description: Home Assistant notify services to alert, without the "notify." part, e.g. mobile_app_my_phone.
  persistent_notification:
    name: Home Assistant bell notification
    description: Show a notification in Home Assistant's sidebar while something is down.
  notify_recovery:
    name: Notify when things come back
    description: Also send a notification when something that was down is working again.
  email_send:
    name: "Send email with"
    description: "\"smtp\": any mail server, such as an internal relay (e.g. an Exchange receive connector that allows Home Assistant's address) or one that needs a user name and password. \"microsoft365\": Microsoft 365 through Microsoft Graph, with an app registration. \"off\": no email."
  email_to:
    name: "Send email to"
    description: "Addresses that get email alerts and the daily summary."
  email_from:
    name: "Send email from"
    description: "The sender address. For Microsoft 365, the mailbox the app sends as."
  email_red:
    name: "Red alerts"
    description: "Problems as they happen: a device down, a check gone red, a failed backup."
  email_recovery:
    name: "When things come back"
    description: "When something that was red is working again."
  email_warnings:
    name: "Amber warnings and events"
    description: "As they happen: late backups, log and security events, threats Defender removed. Untick to get them in the daily summary instead."
  email_digest:
    name: "Daily summary"
    description: "Once a day: everything that's amber or red, plus warnings and events not already emailed."
  email_digest_time:
    name: "Daily summary at"
    description: "HH:MM in Home Assistant's time zone, e.g. 08:00."
  email_about_devices:
    name: "Devices not responding"
    description: "A device that stops replying, and when it's back."
  email_about_services:
    name: "Service checks"
    description: "Ports, websites, certificates, SIP and Home Assistant sensors."
  email_about_network:
    name: "SNMP and syslog"
    description: "Firewalls, VPNs, switches, iDRACs and syslog alerts."
  email_about_agents:
    name: "Agent checks and log events"
    description: "Disks, services, Windows updates and the other agent checks, and Windows or Linux log events."
  email_about_backups:
    name: "Backups"
    description: "Backup jobs that failed, were missed or are overdue."
  email_about_security:
    name: "Security"
    description: "Security events, Defender, passwords found in files, privileged group changes and agent file changes."
  email_about_updates:
    name: "Updates"
    description: "A new app version, or an agent update rollout that stopped."
  smtp_host:
    name: "SMTP server"
    description: "The mail server's name or address, e.g. mail.example.local."
  smtp_port:
    name: "SMTP port"
    description: "Usually 25 for an internal relay, 587 with STARTTLS, or 465 with SSL."
  smtp_security:
    name: "SMTP security"
    description: "\"starttls\" (port 587, or 25 if the relay offers it), \"ssl\" (port 465), or \"none\" for a relay on your own network that doesn't offer encryption."
  smtp_check_certificate:
    name: "Check the server's certificate"
    description: "Turn off for an internal mail server whose certificate Home Assistant doesn't trust, such as Exchange's own self-signed one. The connection is still encrypted."
  smtp_username:
    name: "SMTP user name"
    description: "Leave blank for a relay that doesn't need signing in."
  smtp_password:
    name: "SMTP password"
    description: "Only needed with a user name. Stored with the add-on's settings and never shown again."
  m365_tenant_id:
    name: "Microsoft 365 tenant ID"
    description: "Your directory (tenant) ID, from Microsoft Entra ID."
  m365_client_id:
    name: "Microsoft 365 application (client) ID"
    description: "From the app registration that has the Mail.Send application permission (with admin consent)."
  m365_client_secret:
    name: "Microsoft 365 client secret"
    description: "The app registration's client secret. Stored with the add-on's settings and never shown again."
  log_level:
    name: Log level
    description: How much the add-on writes to its Log tab. "info" is right for everyday use; "debug" helps when troubleshooting.
  maintenance_minutes:
    name: Default pause length (minutes)
    description: The time limit offered when you pause a device for a reboot or maintenance.
  notification_url:
    name: Notification link
    description: Where tapping a notification goes. Leave blank to open the Rollcall dashboard.
  admin_only_changes:
    name: Only admins can make changes
    description: Only Home Assistant administrators (and the people listed under Editors) can add, change, pause or delete things. Everyone else can look.
  editors:
    name: Editors
    description: Home Assistant usernames of people who aren't administrators but may make changes.
  cert_warn_days:
    name: Certificate warning (days before expiry)
    description: Certificate checks go amber this many days before the certificate expires.
  cert_crit_days:
    name: Certificate alert (days before expiry)
    description: Certificate checks go red, with a notification, this many days before expiry or once expired.
  ups_runtime_warn_minutes:
    name: UPS runtime warning (minutes)
    description: A UPS goes amber when its battery would last less than this. 0 turns it off. Each UPS can have its own limits in its details.
  ups_runtime_crit_minutes:
    name: UPS runtime alert (minutes)
    description: A UPS goes red when its battery would last less than this. 0 turns it off.
  ups_load_warn:
    name: UPS load warning (%)
    description: A UPS goes amber at this load or more. 95% or more is always red.
  agent_stale_minutes:
    name: Agent not reporting after (minutes)
    description: An agent goes red when it hasn't reported for this long.
  agent_slow_seconds:
    name: Slow agent run (seconds)
    description: An agent goes amber when one run takes longer than this. 0 turns it off.
  agent_disk_warn:
    name: Disk space warning (% free)
    description: Disks go amber at or below this much free space. Each disk can have its own limits in the device's details.
  agent_disk_crit:
    name: Disk space alert (% free)
    description: Disks go red at or below this much free space.
  agent_failed_logons:
    name: Failed logons that count as an attack
    description: This many failed logons in one agent report turns the Security check red.
  agent_laps_overdue_days:
    name: LAPS overdue (days)
    description: The LAPS check goes red once a password rotation is this many days overdue.
  agent_bitlocker_require:
    name: Require BitLocker on
    description: Which physical devices with a TPM must use BitLocker. "workstations" means Windows 10 and 11. Devices that already use BitLocker are always checked; virtual machines never are.
  agent_sql_backup_hours:
    name: SQL Server backup age (hours)
    description: A database goes amber when it has had no full or differential backup for this long.
  printer_supply_warn:
    name: Printer supplies warning (%)
    description: A printer goes amber when a toner, ink or other supply is at or below this level.
  software_updates:
    name: Highlight newer software versions
    description: Mark installed programs that have a newer version. Windows uses the winget catalogue, downloaded once a day; Linux uses the package manager. Never alerts.
  vuln_checks:
    name: Vulnerability alerts
    description: "Check Windows builds and Linux packages against public lists of known vulnerabilities (CVEs), downloaded daily: Microsoft's security updates, OSV.dev for Linux, and CISA's list of exploited vulnerabilities. Amber when one scores at or above the level below; red when one is known to be exploited."
  vuln_min_score:
    name: Vulnerability score to alert on (CVSS)
    description: "Vulnerabilities scoring this much or more out of 10 go amber. 9 means \"critical\"; 7 includes \"high\" too. Known-exploited ones always count."
  vuln_linux_source:
    name: Linux vulnerability data
    description: "\"local\": download each distro's data from OSV.dev daily and match it here, so nothing about your devices is sent anywhere (larger downloads). \"online\": send OSV.dev one combined list of package names and versions and let it match (small downloads; no device names or addresses). \"off\": don't check Linux."
  agent_secret_scan:
    name: Scan for passwords left in files
    description: Which devices' agents look for passwords saved in plain text (scripts, notes, setup files). Only where each one is reaches Rollcall, never the password. Each device can be turned on or off in its details.
  ip_ranges:
    name: Named IP ranges
    description: "Names for parts of your network, shown next to each device's address, e.g. Servers=10.0.1.0/24 or IoT=192.168.20.10-200. A range can be a subnet, a span (10.0.1.10-50) or end in a wildcard (10.0.1.*); separate several with commas. Where ranges overlap, the smallest one wins."
  name_line:
    name: Line under each name
    description: What the dashboard shows under each device's name, unless the device has its own choice. "auto" shows the make and model, or else the operating system.
  agent_exchange_queue_warn:
    name: Exchange queue warning (messages)
    description: The Exchange check goes amber when this many messages are waiting to be delivered.
  agent_time_warn_seconds:
    name: "Clock out by (amber, seconds)"
    description: "A domain device's Time check goes amber when its clock is this far from its domain controller's."
  agent_time_crit_seconds:
    name: "Clock out by (red, seconds)"
    description: "The Time check goes red at this. Kerberos sign-ins fail at 300 seconds (5 minutes)."
  agent_patch_days:
    name: Windows updates overdue (days)
    description: The Updates check goes amber when nothing has been installed for this long. 0 turns it off.
  agent_event_alerts:
    name: Alert on System log events
    description: Alert when one of the watched System log events below appears (unexpected shutdowns, crashes, disk errors and so on).
  agent_security_alerts:
    name: Alert on Security log events
    description: Alert when one of the watched Security log events below appears (lockouts, new accounts, group changes, cleared logs).
  agent_event_watch:
    name: Watched System log events
    description: System log events that alert, written as "Source:ID" or just an ID, e.g. Kernel-Power:41.
  agent_security_alert_ids:
    name: Watched Security log event IDs
    description: Security log event IDs that alert, e.g. 4740 for an account lockout.
  agent_watch_services:
    name: Extra services to watch
    description: Windows or Linux services to watch on every server, as well as the ones Rollcall picks automatically.
  agent_ignore:
    name: Ignore everywhere
    description: Things to ignore on every server, e.g. a service, event or disk. Most ignores are easier to add with the Ignore buttons in the dashboard.
  agent_auto_add:
    name: Add approved servers automatically
    description: When you approve an agent, add its device to the dashboard straight away.
  agent_ssl:
    name: Agent port uses HTTPS
    description: Serve the agent port over HTTPS, using the certificate below from Home Assistant's /ssl folder.
  agent_certfile:
    name: Agent HTTPS certificate
    description: The certificate file in Home Assistant's /ssl folder.
  agent_keyfile:
    name: Agent HTTPS private key
    description: The certificate's private key file in Home Assistant's /ssl folder.
  hosts:
    name: Import devices
    description: Optional. Devices listed here are imported into the dashboard once, then this list is emptied. Adding them in the dashboard is easier.
network:
  8100/tcp: Agent reports (Windows and Linux servers send their health here)
  5140/udp: Syslog (devices send their log messages here)
