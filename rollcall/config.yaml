name: Rollcall
version: "1.94.2"
slug: ping_monitor
description: "Who's up, and how are they doing? Server monitoring by ping, service checks, Home Assistant sensors and optional Windows and Linux agents (disk, services, containers, logs, security, updates), with a dashboard and alerts."
url: https://github.com/shoey79/rollcall
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:list-status
panel_title: Rollcall
panel_admin: false
homeassistant_api: true
hassio_api: true
ports:
  8100/tcp: 8100
  8101/tcp: 8101
  5140/udp: 514
ports_description:
  8100/tcp: Agent reports (Windows and Linux servers send their health here)
  8101/tcp: Agent reports over HTTPS (Rollcall's own certificate, once turned on under Agents)
  5140/udp: Syslog (devices send their log messages here)
map:
  - ssl
options:
  interval: 300
  retry_interval: 300
  ping_count: 3
  ping_timeout: 2
  service_timeout: 5
  history_days: 7
  metrics_days: 365
  notify_services: []
  persistent_notification: true
  notify_recovery: true
  log_level: info
  maintenance_minutes: 30
  notification_url: ""
  email_send: "off"
  email_to: []
  email_from: ""
  email_red: true
  email_recovery: true
  email_warnings: false
  email_digest: true
  email_digest_time: "08:00"
  email_about_devices: true
  email_about_services: true
  email_about_network: true
  email_about_agents: true
  email_about_backups: true
  email_about_security: true
  email_about_updates: true
  smtp_host: ""
  smtp_port: 25
  smtp_security: starttls
  smtp_check_certificate: true
  smtp_username: ""
  smtp_password: ""
  m365_tenant_id: ""
  m365_client_id: ""
  m365_client_secret: ""
  admin_only_changes: true
  editors: []
  cert_warn_days: 30
  cert_crit_days: 7
  ups_runtime_warn_minutes: 15
  ups_runtime_crit_minutes: 5
  ups_load_warn: 80
  agent_stale_minutes: 15
  agent_slow_seconds: 120
  agent_disk_warn: 15
  agent_disk_crit: 5
  agent_memory_warn: 90
  agent_memory_crit: 95
  agent_cpu_warn: 90
  agent_cpu_reports: 3
  messages: false
  agent_failed_logons: 20
  agent_laps_overdue_days: 3
  agent_bitlocker_require: workstations
  agent_sql_backup_hours: 36
  printer_supply_warn: 10
  software_updates: true
  vuln_checks: true
  vuln_min_score: 9
  vuln_linux_source: local
  agent_secret_scan: "off"
  name_line: auto
  ip_ranges: []
  agent_exchange_queue_warn: 250
  agent_time_warn_seconds: 60
  agent_time_crit_seconds: 240
  agent_patch_days: 60
  agent_event_alerts: true
  agent_security_alerts: true
  agent_event_watch:
    - "Kernel-Power:41"
    - "EventLog:6008"
    - "BugCheck:1001"
    - "disk:7"
    - "disk:51"
    - "disk:153"
    - "Ntfs:55"
    - "Ntfs:98"
  agent_security_alert_ids: [4740, 4720, 4726, 4728, 4732, 4756, 1102, 4719]
  agent_watch_services: []
  agent_ignore: []
  agent_auto_add: true
  agent_ssl: false
  agent_certfile: fullchain.pem
  agent_keyfile: privkey.pem
  hosts: []
schema:
  interval: int(30,3600)
  retry_interval: int(10,3600)
  ping_count: int(1,10)
  ping_timeout: int(1,10)
  service_timeout: int(1,30)
  history_days: int(1,90)
  metrics_days: int(7,1825)?
  notify_services:
    - str
  persistent_notification: bool
  notify_recovery: bool
  log_level: list(debug|info|warning|error)
  maintenance_minutes: int(1,1440)
  notification_url: str?
  email_send: list(off|smtp|microsoft365)?
  email_to:
    - str?
  email_from: str?
  email_red: bool?
  email_recovery: bool?
  email_warnings: bool?
  email_digest: bool?
  email_digest_time: str?
  email_about_devices: bool?
  email_about_services: bool?
  email_about_network: bool?
  email_about_agents: bool?
  email_about_backups: bool?
  email_about_security: bool?
  email_about_updates: bool?
  smtp_host: str?
  smtp_port: int(1,65535)?
  smtp_security: list(starttls|ssl|none)?
  smtp_check_certificate: bool?
  smtp_username: str?
  smtp_password: password?
  m365_tenant_id: str?
  m365_client_id: str?
  m365_client_secret: password?
  admin_only_changes: bool
  editors:
    - str
  cert_warn_days: int(1,365)
  cert_crit_days: int(0,365)
  ups_runtime_warn_minutes: int(0,600)
  ups_runtime_crit_minutes: int(0,600)
  ups_load_warn: int(1,100)
  agent_stale_minutes: int(5,1440)
  agent_slow_seconds: int(0,3600)
  agent_disk_warn: int(1,90)
  agent_disk_crit: int(1,90)
  agent_memory_warn: int(0,100)
  agent_memory_crit: int(0,100)
  agent_cpu_warn: int(0,100)
  agent_cpu_reports: int(1,12)
  messages: bool
  agent_failed_logons: int(1,100000)
  agent_laps_overdue_days: int(1,60)
  agent_bitlocker_require: list(off|workstations|all)
  agent_sql_backup_hours: int(1,8760)
  printer_supply_warn: int(1,50)
  software_updates: bool
  vuln_checks: bool
  vuln_min_score: int(1,10)
  vuln_linux_source: list(local|online|off)
  agent_secret_scan: list(off|servers|workstations|all)
  name_line: list(auto|model|os|address|user|none)
  ip_ranges:
    - str
  agent_exchange_queue_warn: int(1,1000000)
  agent_time_warn_seconds: int(5,3600)?
  agent_time_crit_seconds: int(10,3600)?
  agent_patch_days: int(0,3650)
  agent_event_alerts: bool
  agent_security_alerts: bool
  agent_event_watch:
    - str
  agent_security_alert_ids:
    - int
  agent_watch_services:
    - str
  agent_ignore:
    - str
  agent_auto_add: bool
  agent_ssl: bool
  agent_certfile: str
  agent_keyfile: str
  hosts:
    - name: str
      host: str
      checks:
        - str?
